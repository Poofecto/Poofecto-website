
media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: pawsitivity
    label: Paw-sitivity
    type: file
    path: content/pawsitivity.json
    format: json
    fields:
      - name: posts
        label: Posts
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Headline
            type: string
          - name: category
            label: Category
            type: string
          - name: date
            label: Post date
            type: string
          - name: image
            label: Photo
            type: image
          - name: summary
            label: Description
            type: text
          - name: event_date
            label: Event date
            type: string
          - name: link
            label: External link
            type: string
          - name: link_text
            label: Link button text
            type: string

  - name: homepage_carousel
    label: Homepage Carousel
    type: file
    path: content/carousel.json
    format: json
    fields:
      - name: slides
        label: Carousel Slides (drag to reorder)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: visible
            label: Show this slide
            type: boolean
          - name: image
            label: Photo
            type: image
          - name: alt
            label: Image description (accessibility)
            type: string
          - name: title
            label: Headline
            type: string
          - name: category
            label: Category
            type: select
            options:
              values: [Dogs, Events, News, Community, Promotions]
          - name: description
            label: Short paragraph
            type: text
          - name: link
            label: Optional link (full URL or #section)
            type: string
          - name: link_text
            label: Optional link text
            type: string
